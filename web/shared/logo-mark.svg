  <circle cx="96" cy="160" r="27" fill="#fff"/>
  <circle cx="96" cy="160" r="15" fill="url(#lg)"/>
  <circle cx="96" cy="160" r="5" fill="#fff"/>
  <!-- IoT pulse at the hand -->
  <circle cx="196" cy="104" r="8" fill="#1646D6"/>
  <path d="M212 78 A30 30 0 0 1 222 112" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
