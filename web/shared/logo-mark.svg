<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ExoRehab logo">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3C88FF"/><stop offset="1" stop-color="#1646D6"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#lg)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#hl)"/>
